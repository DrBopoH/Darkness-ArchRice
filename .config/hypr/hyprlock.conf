# ~/.config/hypr/hyprlock.conf

background {
    monitor =
    path = screenshot
    color = rgba(15, 23, 20, 1.0)
    blur_passes = 3
    blur_size = 6
    noise = 0.02
    contrast = 0.85
    brightness = 0.4
}

input-field {
    monitor =
    size = 320, 42
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgb(46, 67, 59)
    inner_color = rgb(15, 23, 20)
    font_color = rgb(200, 194, 184)
    fade_on_empty = false
    font_family = monospace
    placeholder_text = <span foreground="##c8c2b8">[password]: </span>
    hide_input = false
    rounding = 0
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(200, 194, 184)
    font_size = 56
    font_family = monospace
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER@arch-victus16
    color = rgb(100, 140, 120)
    font_size = 13
    font_family = monospace
    position = 0, 5
    halign = center
    valign = center
}